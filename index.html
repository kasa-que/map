<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>笠間城クエスト</title>

  <!-- DotGothic16 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================
       基本
    ===================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #333;
      font-family: "DotGothic16", sans-serif;
    }

    body {
      min-height: 100vh;
    }


    /* =====================================
       メイン
    ===================================== */

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;

      padding: 18px 18px 20px;

      display: flex;
      flex-direction: column;
    }


    /* =====================================
       ロゴ
    ===================================== */

    .logo {
      text-align: center;
      margin-bottom: 4px;
    }

    .logo img {
      width: min(82%, 300px);
      height: auto;
      display: block;
      margin: 0 auto;
    }


    /* =====================================
       イラスト
    ===================================== */

    .hero {
      text-align: center;
      margin: 2px 0 8px;
    }

    .hero img {
      width: min(48%, 180px);
      height: auto;
      display: block;
      margin: 0 auto;
    }


    /* =====================================
       お知らせ
    ===================================== */

    .news {
      border-top: 2px solid #bd1928;
      border-bottom: 2px solid #bd1928;

      margin: 4px 0 12px;
      padding: 6px 0;

      overflow: hidden;
      white-space: nowrap;

      font-size: 13px;
      color: #333;
    }

    .news-label {
      color: #bd1928;
      font-weight: bold;
      margin-right: 10px;
    }


    /* =====================================
       メニュー
    ===================================== */

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }


    /* =====================================
       メニューボタン
    ===================================== */

    .menu-button {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 10px 14px;

      background: #ffffff;
      color: #333;

      border: 2px solid #bd1928;
      border-radius: 7px;

      text-decoration: none;

      font-family: "DotGothic16", sans-serif;
      font-size: 15px;

      cursor: pointer;

      transition: background 0.15s ease;
    }

    .menu-button:hover {
      background: #fff5f5;
    }

    .menu-title {
      color: #bd1928;
      font-size: 16px;
    }

    .menu-sub {
      font-size: 11px;
      color: #777;
      margin-left: 10px;
    }

    .arrow {
      color: #bd1928;
      font-size: 18px;
    }


    /* =====================================
       参考文献
    ===================================== */

    .reference-button {
      width: 100%;
      border: 2px solid #bd1928;
      border-radius: 7px;

      background: #ffffff;

      padding: 10px 14px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      font-family: "DotGothic16", sans-serif;
      font-size: 15px;

      color: #333;

      cursor: pointer;
    }

    .reference-button .menu-title {
      color: #bd1928;
    }


    /* =====================================
       参考文献の中身
    ===================================== */

    .reference-list {
      display: none;

      margin-top: -2px;
      padding: 5px 8px 4px;

      border-left: 2px solid #bd1928;
      border-right: 2px solid #bd1928;
      border-bottom: 2px solid #bd1928;

      border-radius: 0 0 7px 7px;

      background: #fffafa;
    }

    .reference-list.open {
      display: block;
    }

    .reference-item {
      display: block;

      padding: 8px 8px;

      color: #333;
      text-decoration: none;

      font-size: 13px;

      border-bottom: 1px dotted #bd1928;
    }

    .reference-item:last-child {
      border-bottom: none;
    }

    .reference-item strong {
      color: #bd1928;
      font-weight: normal;
    }

    .reference-item span {
      display: block;
      font-size: 10px;
      color: #777;
      margin-top: 2px;
    }


    /* =====================================
       フッター
    ===================================== */

    .footer {
      margin-top: auto;

      padding-top: 12px;

      text-align: center;

      font-size: 10px;
      color: #999;
    }


    /* =====================================
       小さいスマホ
    ===================================== */

    @media (max-height: 700px) {

      .page {
        padding-top: 10px;
      }

      .hero img {
        width: 38%;
      }

      .news {
        margin-bottom: 8px;
      }

      .menu {
        gap: 6px;
      }

      .menu-button,
      .reference-button {
        padding: 8px 12px;
      }

    }

  </style>
</head>


<body>

  <main class="page">


    <!-- =================================
         ロゴ
    ================================== -->

    <div class="logo">

      <!-- ファイル名は実際のロゴ画像に変更 -->
  <img src="torii.png" alt="⛩" style="width: 45px; height: 45px; object-fit: contain; display: block;">
  
  <!-- ② 下段：手書きロゴイラスト（logo.png） -->
  <img src="logo.png" alt="笠間城クエスト" style="width: 180px; height: auto; object-fit: contain; display: block; margin-top: 2px;">

    </div>




    <!-- =================================
         お知らせ
    ================================== -->

    <div class="news">

      <span class="news-label">お知らせ</span>

      <marquee scrollamount="4">
        笠間城クエストへようこそ！　古地図を片手に、笠間のまちを歩いてみよう！
      </marquee>

    </div>


    <!-- =================================
         メニュー
    ================================== -->

    <div class="menu">


      <!-- 古地図を歩く -->

      <a
        href="map.html"
        class="menu-button"
      >

        <div>
          <span class="menu-title">
            古地図を歩く
          </span>

          <span class="menu-sub">
            web地図アプリへ
          </span>
        </div>

        <span class="arrow">›</span>

      </a>


      <!-- 研究レポート -->

      <a
        href="report.pdf"
        class="menu-button"
        target="_blank"
      >

        <div>
          <span class="menu-title">
            研究レポート
          </span>

          <span class="menu-sub">
            PDFファイルを見る
          </span>
        </div>

        <span class="arrow">›</span>

      </a>


      <!-- =================================
           参考文献
      ================================== -->

      <div>

        <button
          class="reference-button"
          onclick="toggleReferences()"
        >

          <div>
            <span class="menu-title">
              参考文献
            </span>
          </div>

          <span
            class="arrow"
            id="reference-arrow"
          >
            ＋
          </span>

        </button>


        <div
          class="reference-list"
          id="reference-list"
        >

          <!-- 正保の地図 -->

          <a
            href="#"
            class="reference-item"
            target="_blank"
          >

            <strong>
              正保の地図を見る
            </strong>

            <span>
              デジタルアーカイブへ
            </span>

          </a>


          <!-- 文政の地図 -->

          <a
            href="#"
            class="reference-item"
            target="_blank"
          >

            <strong>
              文政の地図を見る
            </strong>

            <span>
              デジタルアーカイブへ
            </span>

          </a>

        </div>

      </div>


      <!-- このサイトについて -->

      <a
        href="about.html"
        class="menu-button"
      >

        <div>
          <span class="menu-title">
            このサイトについて
          </span>
        </div>

        <span class="arrow">›</span>

      </a>


    </div>


    <!-- =================================
         フッター
    ================================== -->

    <div class="footer">
      笠間城クエスト
    </div>


  </main>


  <script>

    // =====================================
    // 参考文献メニュー開閉
    // =====================================

    function toggleReferences() {

      const list =
        document.getElementById("reference-list");

      const arrow =
        document.getElementById("reference-arrow");

      list.classList.toggle("open");

      if (list.classList.contains("open")) {
        arrow.textContent = "−";
      } else {
        arrow.textContent = "＋";
      }

    }

  </script>

</body>
</html>
