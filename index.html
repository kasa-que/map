<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>稲荷町クエスト</title>

  <style>
    /* =========================
       基本設定
    ========================= */

    :root {
      --paper: #F3E9D2;
      --card: #F8F3E8;
      --ink: #332F29;
      --sub-ink: #6B6254;
      --line: #C9B99B;
      --accent: #B4553D;
      --water: #8FA6A6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "YuMincho",
        serif;
    }


    /* =========================
       ページ全体
    ========================= */

    .page {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 32px 18px 28px;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 20% 20%,
          rgba(255,255,255,0.35),
          transparent 45%
        ),
        radial-gradient(
          ellipse at 80% 70%,
          rgba(120,90,50,0.04),
          transparent 45%
        ),
        var(--paper);
    }


    /* =========================
       タイトル
    ========================= */

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .torii {
      font-size: 42px;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 12px;
    }

    .title {
      margin: 0;
      font-size: clamp(32px, 9vw, 48px);
      letter-spacing: 0.12em;
      font-weight: 600;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--sub-ink);
      font-size: 14px;
      letter-spacing: 0.12em;
    }


    /* =========================
       古地図イメージ部分
    ========================= */

    .town-image {
      position: relative;
      height: 155px;
      margin: 0 -18px 22px;
      overflow: hidden;

      background:
        linear-gradient(
          to bottom,
          transparent 0%,
          rgba(229,211,175,0.25) 100%
        );
    }

    .town-image::before {
      content: "稲荷町";
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);

      font-size: 70px;
      color: rgba(80,70,55,0.08);
      white-space: nowrap;
      pointer-events: none;
    }

    .town-image::after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: 0;
      height: 35px;

      background:
        linear-gradient(
          175deg,
          transparent 40%,
          rgba(143,166,166,0.55) 42%,
          rgba(143,166,166,0.55) 60%,
          transparent 62%
        );
    }


    /* =========================
       メニュー
    ========================= */

    .menu {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .menu-item {
      display: flex;
      align-items: center;

      width: 100%;
      min-height: 105px;
      padding: 15px 16px;

      background: rgba(248,243,232,0.92);
      border: 1px solid rgba(201,185,155,0.7);
      border-radius: 12px;

      box-shadow:
        0 2px 6px rgba(80,60,30,0.08);

      color: var(--ink);
      text-decoration: none;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;
    }

    .menu-item:hover {
      transform: translateY(-2px);
      box-shadow:
        0 5px 12px rgba(80,60,30,0.12);
    }

    .menu-item:active {
      transform: translateY(0);
    }


    /* =========================
       アイコン
    ========================= */

    .menu-icon {
      flex: 0 0 64px;
      width: 64px;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #334B52;
      color: white;

      font-size: 30px;
      margin-right: 18px;
    }

    .menu-item.quest .menu-icon {
      background: var(--accent);
    }

    .menu-item.about .menu-icon {
      background: #4B4A43;
    }


    /* =========================
       文字
    ========================= */

    .menu-text {
      flex: 1;
    }

    .menu-title {
      margin: 0 0 6px;

      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .menu-description {
      margin: 0;

      font-family:
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      font-size: 13px;
      color: var(--sub-ink);
    }

    .arrow {
      font-family: sans-serif;
      font-size: 30px;
      color: var(--sub-ink);
      margin-left: 10px;
    }


    /* =========================
       フッター
    ========================= */

    .footer {
      text-align: center;
      margin-top: 35px;
      padding-bottom: 20px;
    }

    .footer-title {
      font-size: 18px;
      letter-spacing: 0.15em;
    }

    .footer-credit {
      margin-top: 8px;

      font-family: sans-serif;
      font-size: 11px;
      color: var(--sub-ink);
      letter-spacing: 0.1em;
    }


    /* =========================
       スマホ小画面対応
    ========================= */

    @media (max-width: 380px) {

      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .town-image {
        margin-left: -12px;
        margin-right: -12px;
      }

      .menu-item {
        min-height: 90px;
        padding: 12px;
      }

      .menu-icon {
        flex-basis: 52px;
        width: 52px;
        height: 52px;
        font-size: 24px;
        margin-right: 12px;
      }

      .menu-title {
        font-size: 17px;
      }

      .menu-description {
        font-size: 11px;
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <!-- タイトル -->
    <header class="header">

      <div class="torii">⛩</div>

      <h1 class="title">
        稲荷町クエスト
      </h1>

      <p class="subtitle">
        古地図を持って、江戸の町を歩こう
      </p>

    </header>


    <!-- 古地図っぽいイメージ -->
    <div class="town-image"></div>


    <!-- メニュー -->
    <nav class="menu">

      <!-- 古地図 -->
      <a
        class="menu-item"
        href="map.html"
      >
        <div class="menu-icon">🗺</div>

        <div class="menu-text">
          <h2 class="menu-title">
            古地図を歩く
          </h2>

          <p class="menu-description">
            WEB地図アプリへ
          </p>
        </div>

        <div class="arrow">›</div>
      </a>


      <!-- レポート -->
      <a
        class="menu-item"
        href="report.pdf"
        target="_blank"
      >
        <div class="menu-icon">📜</div>

        <div class="menu-text">
          <h2 class="menu-title">
            研究レポート
          </h2>

          <p class="menu-description">
            PDFを開く
          </p>
        </div>

        <div class="arrow">›</div>
      </a>


      <!-- クエスト -->
      <a
        class="menu-item quest"
        href="quest.html"
      >
        <div class="menu-icon">🦊</div>

        <div class="menu-text">
          <h2 class="menu-title">
            クエスト記録
          </h2>

          <p class="menu-description">
            調べて歩いた記録を見る
          </p>
        </div>

        <div class="arrow">›</div>
      </a>


      <!-- ABOUT -->
      <a
        class="menu-item about"
        href="about.html"
      >
        <div class="menu-icon">⛩</div>

        <div class="menu-text">
          <h2 class="menu-title">
            稲荷町クエストについて
          </h2>

          <p class="menu-description">
            はじめに・動機など
          </p>
        </div>

        <div class="arrow">›</div>
      </a>

    </nav>


    <!-- フッター -->
    <footer class="footer">

      <div class="footer-title">
        稲荷町クエスト 🐾
      </div>

      <div class="footer-credit">
        presented by ○○
      </div>

    </footer>

  </main>


  <!-- =========================
       JavaScript
  ========================= -->

  <script>

    // メニューを押したときのちょっとした効果
    document.querySelectorAll(".menu-item").forEach(item => {

      item.addEventListener("click", () => {

        item.style.transform = "scale(0.98)";

        setTimeout(() => {
          item.style.transform = "";
        }, 120);

      });

    });

  </script>

</body>
</html>
