/* === ⭕️ 四角ボタンの透過 ＆ イラストサイズ固定CSS === */
.custom-map-control {
  background: rgba(255, 255, 255, 0.65); 
  backdrop-filter: blur(4px); 
  border-radius: 4px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.3);
  font-family: sans-serif;
  font-size: 13px;
  color: #333;
  box-sizing: border-box;
}

/* ★超重要：閉じている時も開いている時も、すべての四角パネルの最小高さを「36px」に固定します */
.custom-map-control.collapsed,
.custom-map-control.expanded {
  min-height: 36px !important;
  display: flex;
  align-items: center; /* これで中の文字や画像が自動的に縦中央に揃います */
}

/* 最小化（閉じている時）の見た目（36px四方の正方形） */
.custom-map-control.collapsed {
  width: 36px;
  height: 36px;
  justify-content: center;
}

/* 共通：イラストアイコンを縦横28pxに固定 */
.custom-map-control .control-icon {
  width: 28px !important;
  height: 28px !important;
  flex-shrink: 0 !important;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 右上パネル用：【新設定】展開（expanded）された時は、大元の四角アイコンを完全に画面から消去します */
.custom-map-control.expanded .control-icon-toggle {
  display: none !important;
}

/* 中の手書きイラスト画像自体の設定 */
.custom-map-control .control-icon img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* 展開している（開いている時）の見た目 */
.custom-map-control.expanded {
  width: auto;
  padding: 6px 10px; /* 高さを揃えるために上下の余白を少しだけ詰めました */
}

.custom-map-control h4 {
  margin: 0 0 6px 0;
  font-size: 12px;
  color: #666;
  border-bottom: 1px solid #eee;
  padding-bottom: 3px;
  white-space: nowrap;
}

.custom-map-control label {
  display: block;
  margin: 6px 0;
  cursor: pointer;
  white-space: nowrap;
}

.custom-map-control input {
  margin-right: 5px;
  vertical-align: middle;
}

.custom-map-control .control-content {
  display: none;
}

.custom-map-control.expanded .control-content {
  display: block;
}

// === 🆕 ① スマホでも絶対に誤作動しない「四角パネル自動開閉システム」 ===
function setupControlToggle(container) {
  // 最初からexpandedが付いている（左下）場合はcollapsedをつけない
  if (!container.classList.contains('expanded')) {
    container.classList.add('custom-map-control', 'collapsed');
  } else {
    container.classList.add('custom-map-control');
  }

  // 【新ロジック】すべての自作四角パネルを一度「閉じる」共通の命令
  const closeAllPanels = () => {
    const allPanels = document.querySelectorAll('.custom-map-control');
    allPanels.forEach(p => {
      p.classList.remove('expanded');
      p.classList.add('collapsed');
    });
  };

  // アイコンをタップ、またはマウスが乗ったら「開く」
  const expand = () => {
    // 自分が開く前に、まずは他のすべてのパネルを綺麗に閉じさせる
    closeAllPanels();
    container.classList.remove('collapsed');
    container.classList.add('expanded');
  };
  container.addEventListener('mouseenter', expand);
  container.addEventListener('touchstart', expand, { passive: true });

  // マウスが完全に離れたら折りたたむ（最小化）
  container.addEventListener('mouseleave', () => {
    container.classList.remove('expanded');
    container.classList.add('collapsed');
  });

  // ラジオボタンをクリックした時は、タッチのズレを防ぐため「0.3秒待ってから」閉じる
  container.addEventListener('change', () => {
    setTimeout(() => {
      container.classList.remove('expanded');
      container.classList.add('collapsed');
    }, 300);
  });

  // 地図画面をタップしたら折りたたむ
  map.on('click', () => {
    container.classList.remove('expanded');
    container.classList.add('collapsed');
  });

  // パネル内を触ったときに後ろの地図が勝手に動くのを防ぐ
  L.DomEvent.disableClickPropagation(container);
}

        <!-- 🆕 1. メニューの中に、4つ目の選択肢の「文字」だけを安全に追加します -->
        <label><input type="radio" name="layer_opt" onclick="handleLayerRadio('elevation')">陰影起伏図</label>
      </div>
    `;
    setupControlToggle(container);
    return container;
  }
});
map.addControl(new CustomLayersControl());
  
// 🆕 ③ 地図切り替えの実際の処理
function handleLayerRadio(type) {
  map.removeLayer(originalMapGroup);
  map.removeLayer(baseMap);
  map.removeLayer(satelliteMap);
  map.removeLayer(elevationMap);

  if (type === 'original') originalMapGroup.addTo(map);
  if (type === 'base') baseMap.addTo(map);
  if (type === 'satellite') satelliteMap.addTo(map);
  if (type === 'elevation') elevationMap.addTo(map);
  
}

// === 🟢 【新システム】足跡スタート（30秒おき） ===
function startNewTracking() {
  if (!navigator.geolocation) {
    alert("お使いのブラウザは位置情報の追跡に対応していません");
    document.getElementById('opt_stop').checked = true; 
    document.getElementById('track-icon-status').innerText = "🐾";
    return;
  }
  if (myNewWatchId !== null) return; 

  myNewWatchId = navigator.geolocation.watchPosition(
    (pos) => {
      const uLat = pos.coords.latitude;
      const uLng = pos.coords.longitude;
      currentLat = uLat;
      currentLng = uLng;

      // 現在地マーク（青丸）を自動移動
      if (currentLocationMarker) {
        currentLocationMarker.setLatLng([uLat, uLng]);
      } else {
        currentLocationMarker = L.circleMarker([uLat, uLng], {
          radius: 8, color: "blue", fillColor: "blue", fillOpacity: 0.8
        }).addTo(map);
      }

      // 【30秒おきのドット記録システム】（ドットを打つと同時に、ブラウザに保存します）


      const now = Date.now();
      if (myNewLastDotTime === 0 || (now - myNewLastDotTime) >= 30000) {
        // 色を先ほどの茶色（#a07855）にし、直径を2/3（半径4pxから約2.6px）に小さくしました
        const dot = L.circleMarker([uLat, uLng], {
          radius: 2.6,        
          color: "#a07855",   
          fillColor: "#a07855",
          fillOpacity: 0.6,
          stroke: false       
        }).addTo(map);
        myNewTrackDots.push(dot); 
        myNewLastDotTime = now;

        
        // 【追加】これまでの足跡データをLocalStorageにテキストとして保存
        const rawCoords = myNewTrackDots.map(d => {
          const ll = d.getLatLng();
          return [ll.lat, ll.lng];
        });
        localStorage.setItem("saved_breadcrumbs", JSON.stringify(rawCoords));
      }



      
    },
    (err) => {
      console.error("位置の追跡に失敗しました:", err.message);
      alert("⚠️ GPS信号が弱いため記録を開始できません。");
      if (myNewWatchId !== null) {
        navigator.geolocation.clearWatch(myNewWatchId);
        myNewWatchId = null;
      }
      document.getElementById('opt_stop').checked = true;
      document.getElementById('track-icon-status').innerText = "🐾";
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

// === 距離計算 ===
function isNear(lat1, lng1, lat2, lng2, radius) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c < radius;
}

    const timeStr = reiwaYear + kanjiMonth + kanjiDay + " " + kanjiHour + kanjiMin;
    localStorage.setItem("stamp_time_" + s.id, timeStr);

////////////軌跡ここから
// === 軌跡（ドット記録）機能の変数 ===
let watchId = null;          // GPSの継続監視を管理するID
let trackDots = [];          // 地図上に打った「てんてん」のマークを保存する箱
let lastDotTime = 0;         // 最後にドットを打った時刻（ミリ秒）

// === 🏁 スタンプラリー開始 ===
function startTracking() {
  if (!navigator.geolocation) {
    alert("お使いのブラウザは位置情報の追跡に対応していません");
    return;
  }
  if (watchId !== null) return; 

  alert("🏁 記録を開始しました！30秒ごとに地図に足跡（てんてん）が刻まれます。");
  
  document.getElementById("startBtn").disabled = true;
  document.getElementById("stopBtn").disabled = false;

  // リセット
  trackDots = [];
  lastDotTime = 0; 

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const uLat = pos.coords.latitude;
      const uLng = pos.coords.longitude;

      currentLat = uLat;
      currentLng = uLng;

      // 現在地マーク（青丸）を自動移動
      if (currentLocationMarker) {
        currentLocationMarker.setLatLng([uLat, uLng]);
      } else {
        currentLocationMarker = L.circleMarker([uLat, uLng], {
          radius: 8, color: "blue", fillColor: "blue", fillOpacity: 0.8
        }).addTo(map);
      }

      // 【時間判定】現在の時刻（ミリ秒）を取得
      const now = Date.now();

      // 初回、または前回のドット作成から30000ミリ秒（30秒）以上経過しているか判定
      if (lastDotTime === 0 || (now - lastDotTime) >= 30000) {
        
        // 小さな赤いドットを地図上に配置（線は引かない）
        const dot = L.circleMarker([uLat, uLng], {
          radius: 4,          // 点の大きさ
          color: "red",       // 点の色
          fillColor: "red",
          fillOpacity: 0.6,
          stroke: false       // 枠線を消して滑らかな丸にする
        }).addTo(map);

        // あとで一括消去できるように箱に保存
        trackDots.push(dot);

        // 最後にドットを打った時間を今に更新
        lastDotTime = now;
      }
    },
    (err) => {
      console.error("位置の追跡に失敗しました:", err.message);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

// === 🎯 ゴール（追跡ストップ） ===
function stopTracking() {
  if (watchId === null) return;

  navigator.geolocation.clearWatch(watchId);
  watchId = null;

  alert("🎯 ゴール！お疲れ様でした。歩いた足跡が地図に残ります。");

  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;
}


// ※【注意】以前のリセット機能（resetStamps）に、打った点（てんてん）も一緒に消す処理を追加しておきます
function resetStamps() {
  if (confirm("スタンプと歩いた足跡をすべて消しますか？")) {
    spots.forEach(s => {

    });

    trackDots.forEach(dot => map.removeLayer(dot));
    trackDots = [];
    
    updateMapMarkers();

  }
}

function restoreBreadcrumbs() {
  const savedData = localStorage.getItem("saved_breadcrumbs");
  if (savedData) {
    try {
      // 保存されていた緯度経度のリストを読み込む
      const coordsList = JSON.parse(savedData);
      
      coordsList.forEach(coord => {
        // 過去の足跡ドットを地図上に再現
        const dot = L.circleMarker(coord, {
          radius: 2.6, color: "#a07855", fillColor: "#a07855", fillOpacity: 0.6, stroke: false
        }).addTo(map);
        
        // 配列（箱）にも戻しておく
        myNewTrackDots.push(dot);
      });
    } catch (e) {
      console.error("足跡データの復元に失敗しました", e);
    }
  }
}
